name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Manual runs. Added because GitHub throttled webhook delivery during an
  # Actions incident and pull_request events stopped starting workflows at
  # all — dispatch goes through the API instead and is unaffected.
  workflow_dispatch:

# Least privilege: every job only reads the repo.
permissions:
  contents: read

# Cancel an in-progress run when a *PR branch* is pushed again — but never a
# push to main, or that commit keeps a permanently "cancelled" status.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    name: Documentation checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Actions are pinned to immutable commit SHAs: a mutable tag can be
      # repointed at tampered code after the fact, a commit SHA cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Check links, anchors, fences and tables
        run: python3 tools/doccheck/checkdocs.py .

      - name: Parse every Mermaid diagram
        run: |
          npm --prefix tools/doccheck install --no-save mermaid@11 jsdom@25
          node tools/doccheck/mmdcheck.mjs .

  android:
    name: Test, lint, assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Supply-chain gate: reject a tampered gradle-wrapper.jar.
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Pin the NDK and CMake the catalog names (gradle/libs.versions.toml);
      # the runner image's defaults can move under us.
      - name: Install NDK and CMake
        run: |
          NDK="$(sed -nE 's/^ndk = "(.*)"/\1/p' gradle/libs.versions.toml)"
          CMAKE="$(sed -nE 's/^cmake = "(.*)"/\1/p' gradle/libs.versions.toml)"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK" "cmake;$CMAKE" > /dev/null

      # The ~100 MB Stockfish network, keyed on the file name pinned in
      # evaluate.h (the name is its own hash prefix).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/nnue
          key: nnue-${{ hashFiles('third_party/stockfish/src/evaluate.h') }}

      - name: Fetch and verify the network
        run: scripts/fetch-nnue.sh

      # Engine-backed tests (fixtures, decisions, screenshots) run against a
      # host build of the same vendored Stockfish.
      - name: Build host Stockfish
        run: scripts/build-stockfish-host.sh

      - name: Test, lint, and assemble
        run: ./gradlew test testDebugUnitTest lintDebug assembleDebug

      # The release variant is the only one that runs R8 and the arm64-only
      # native build; prove it on every change, not first at tag time.
      - name: Assemble release
        run: ./gradlew assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chess-and-cocoa-release-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
