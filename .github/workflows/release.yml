# Release: a pushed v* tag builds, verifies, and publishes the release APK.
#
# Signing: both build types are signed with the checked-in app/debug.keystore:
# zero secrets, reproducible by anyone, sideload distribution.
#
# Hardening (family contract): least-privilege permissions, no cancellation
# (a half-cancelled publish is worse than a slow one), timeouts, wrapper
# validation before any Gradle execution, and a tag/versionName gate so a tag
# can only publish the version the commit actually declares.
#
# GPL release gate (concept Section 14.4): the APK carries the license text
# and notices; the release links the tagged source, which includes the
# vendored Stockfish sources.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Verify tag matches committed versionName
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          COMMITTED="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]*)".*$/\1/p' app/build.gradle.kts | head -n 1)"
          if [ "$VERSION" != "$COMMITTED" ]; then
            echo "!! tag v$VERSION does not match committed versionName $COMMITTED" >&2
            echo "!! re-cut the release with scripts/release.sh" >&2
            exit 1
          fi

      - name: Install NDK and CMake
        run: |
          NDK="$(sed -nE 's/^ndk = "(.*)"/\1/p' gradle/libs.versions.toml)"
          CMAKE="$(sed -nE 's/^cmake = "(.*)"/\1/p' gradle/libs.versions.toml)"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK" "cmake;$CMAKE" > /dev/null

      - name: Fetch network and build host Stockfish
        run: |
          scripts/fetch-nnue.sh
          scripts/build-stockfish-host.sh

      # Re-prove the tagged commit: a tag can land on a commit CI never saw.
      - name: Test and lint
        run: ./gradlew test testDebugUnitTest lintDebug

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Stage release artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/chess-and-cocoa-${GITHUB_REF_NAME}.apk"
          (cd dist && sha256sum "chess-and-cocoa-${GITHUB_REF_NAME}.apk" > "chess-and-cocoa-${GITHUB_REF_NAME}.apk.sha256")

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chess-and-cocoa-release-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish release APK
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chess-and-cocoa-release-${{ github.sha }}
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Chess & Cocoa ${{ github.ref_name }}
          body: |
            Free software under GPL-3.0-or-later. Complete corresponding source, including the vendored Stockfish 19 engine: https://github.com/${{ github.repository }}/tree/${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/*.apk
            dist/*.sha256
